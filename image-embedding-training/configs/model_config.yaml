model:
  type: "CNN"
  input_shape: [224, 224, 3]
  layers:
    - type: "Conv2D"
      filters: 32
      kernel_size: 3
      activation: "relu"
      padding: "same"
    - type: "MaxPooling2D"
      pool_size: 2
    - type: "Conv2D"
      filters: 64
      kernel_size: 3
      activation: "relu"
      padding: "same"
    - type: "MaxPooling2D"
      pool_size: 2
    - type: "Flatten"
    - type: "Dense"
      units: 128
      activation: "relu"
    - type: "Dense"
      units: 64
      activation: "relu"
    - type: "Dense"
      units: 32
      activation: "sigmoid"
  output:
    embedding_size: 32
    normalization: "l2"